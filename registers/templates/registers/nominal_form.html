{% extends "registers/base.html" %}
{% block content %}
<div style="max-width:650px;margin:25px auto;padding:20px;">
  <h2>Register New OP Patient</h2>
  <p><strong>Facility:</strong> {{ facility }}</p>
  {% if messages %}{% for message in messages %}
    <p style="padding:9px;background:#fff0e0;">{{ message }}</p>
  {% endfor %}{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Registration date</label>
    <input type="date" name="registered_date" value="{{ form_data.registered_date|default:today|date:'Y-m-d' }}" required style="display:block;width:100%;padding:9px;margin:5px 0 14px;">
    <label>Patient name</label>
    <input type="text" name="name" value="{{ form_data.name|default:'' }}" maxlength="150" required style="display:block;width:100%;padding:9px;margin:5px 0 14px;">
    <label>Age (years)</label>
    <input type="number" name="age" min="0" max="120" value="{{ form_data.age|default:'' }}" required style="display:block;width:100%;padding:9px;margin:5px 0 5px;">
    <small>Age 0–12: child. Age 13 and above: adult.</small>
    <label style="display:block;margin-top:14px;">Gender</label>
    <select name="gender" required style="display:block;width:100%;padding:9px;margin:5px 0 14px;">
      <option value="">Select gender</option>
      <option value="M" {% if form_data.gender == "M" %}selected{% endif %}>Male</option>
      <option value="F" {% if form_data.gender == "F" %}selected{% endif %}>Female</option>
    </select>
    <button type="submit" style="padding:11px 20px;">Save Patient and Generate OP Number</button>
    <a href="{% url 'registers:nominal_list' %}" style="margin-left:12px;">Cancel</a>
  </form>
</div>
{% endblock %}
