<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm Delete | VARAM</title>
<style>
body{font-family:Arial;background:#f5f8f4;color:#20332a;margin:24px}
main{max-width:650px;margin:auto;background:white;padding:24px;border-radius:12px}
h1{color:#a12626}
button,a{display:inline-block;padding:10px 14px;border:0;border-radius:6px;text-decoration:none;cursor:pointer}
button{background:#a12626;color:white}
a{background:#e9f1eb;color:#124c34}
</style>
</head>
<body><main>
<h1>Confirm Delete</h1>
<p>Delete this IP {{ kind }} record?</p>
<p><strong>{{ description }}</strong></p>
<p>This cannot be undone. The IP patient record itself will remain.</p>
<form method="post">
{% csrf_token %}
<button type="submit">Yes, Delete Record</button>
<a href="{{ back_url }}">Cancel</a>
</form>
</main></body></html>
