
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VARAM — Sign in</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6f4;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 32px;
            border-radius: 14px;
            width: min(360px, calc(100% - 64px));
            box-shadow: 0 8px 30px #00000012;
        }
        h1 { color: #176b45; margin-top: 0; }
        label { display: block; margin: 16px 0 6px; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5ce;
            border-radius: 6px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #176b45;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
        .error { color: #b42318; }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>VARAM</h1>
        <p>Sign in to your facility account.</p>

        {% if form.errors %}
            <p class="error">Invalid username or password.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="id_username">Username</label>
            {{ form.username }}

            <label for="id_password">Password</label>
            {{ form.password }}

            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
